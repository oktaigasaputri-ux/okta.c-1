name: Build C++ EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Check files
        shell: powershell
        run: |
          Get-ChildItem -Recurse

      - name: Check compiler
        run: g++ --version

      - name: Compile C++
        shell: powershell
        run: |
          g++ -x c++ "okta.c+" -o "program.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
